            spark_version: ${var.spark_version}
            node_type_id: ${var.node_type_id}
            driver_node_type_id: ${var.driver_node_type_id}
            data_security_mode: USER_ISOLATION
            runtime_engine: PHOTON
            autoscale:
              min_workers: 1
              max_workers: ${var.max_workers}
      tasks:
        - task_key: team_match_summary
          job_cluster_key: gold_team
          notebook_task:
            notebook_path: ${var.notebook_root}/gold/30_team_match_summary
            base_parameters: *gold_parameters
          max_retries: 3
        - task_key: team_performance_window
          depends_on:
            - task_key: team_match_summary
          job_cluster_key: gold_team
          notebook_task:
            notebook_path: ${var.notebook_root}/gold/31_team_performance_window
            base_parameters: *gold_parameters
          max_retries: 3
        - task_key: team_space_creation
          depends_on:
            - task_key: team_performance_window
          job_cluster_key: gold_team
          notebook_task:
            notebook_path: ${var.notebook_root}/gold/32_team_space_creation_profile
            base_parameters: *gold_parameters
          max_retries: 3
        - task_key: team_pressing
          depends_on:
            - task_key: team_performance_window
          job_cluster_key: gold_team
          notebook_task:
            notebook_path: ${var.notebook_root}/gold/33_team_pressing_profile
