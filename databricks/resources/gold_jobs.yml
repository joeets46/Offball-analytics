          notebook_task:
            notebook_path: ${var.notebook_root}/gold/34_team_attribution_profile
            base_parameters: *gold_parameters
          max_retries: 3

    offball_s3_gold_match_marts:
      name: "[${bundle.target}] Off-Ball S3 Gold match marts"
      description: "Publishes fixture, participant, result, scoring, incident, and quality marts."
      max_concurrent_runs: 1
      timeout_seconds: 10800
      tags:
        system: offball
        sprint: "3"
