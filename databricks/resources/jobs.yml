resources:
  jobs:
    offball_s1_register_snapshot:
      name: "[${bundle.target}] Off-Ball S1 Register source snapshot"
      description: "Registers a source delivery before Bronze ingestion."
      max_concurrent_runs: 1
      timeout_seconds: 1800
      tags:
        system: offball
        sprint: "1"
        layer: bronze
        purpose: snapshot
      job_clusters:
        - job_cluster_key: snapshot_cluster
          new_cluster:
            spark_version: ${var.spark_version}
            node_type_id: ${var.node_type_id}
            driver_node_type_id: ${var.driver_node_type_id}
            data_security_mode: USER_ISOLATION
            runtime_engine: PHOTON
            autoscale:
              min_workers: 1
              max_workers: 2
      tasks:
        - task_key: register_snapshot
          job_cluster_key: snapshot_cluster
          notebook_task:
            notebook_path: ${var.notebook_root}/orchestration/90_register_source_snapshot
            base_parameters:
              catalog: ${resources.catalogs.offball_catalog.name}
              bronze_schema: ${resources.schemas.bronze.name}
              bronze_root_uri: ${var.bronze_root_uri}
              source_delivery_uri: ${var.source_delivery_uri}
              source_secret_scope: ${var.source_secret_scope}
              source_system_code: ${var.source_system_code}
              source_object_name: sprint1_delivery
              source_version: ${var.source_version}
              run_mode: ${var.run_mode}
          max_retries: 2
          min_retry_interval_millis: 60000
      email_notifications:
        on_failure:
          - ${var.alert_email}

    offball_s1_ingest_athlete_bronze:
      name: "[${bundle.target}] Off-Ball S1 Ingest athlete Bronze"
      description: "Ingests approved athlete-domain source products into immutable Bronze Delta tables."
